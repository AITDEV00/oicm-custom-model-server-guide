site_name: OICM Custom Model Server Guide
site_description: Reference Docker images / startup.sh templates and OICM platform contracts for building Custom Model Servers (vLLM, SGLang, diagnostics).
site_url: https://github.com/openinnovationai/custom-model-server-guide
site_author: openinnovationai contributors

repo_url: https://github.com/openinnovationai/custom-model-server-guide
repo_name: openinnovationai/custom-model-server-guide
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-2
        name: Switch to system preference
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home:
      - Overview: index.md
      - Platform contract: contract.md
  - vLLM images:
      - vllm/index.md
      - v0.22.0: vllm/v0.22.0.md
      - v0.23.0: vllm/v0.23.0.md
      - v0.24.0: vllm/v0.24.0.md
      - v0.25.0: vllm/v0.25.0.md
      - v0.25.1: vllm/v0.25.1.md
      - MiniMax-M3: vllm/minimaxm3.md
      - Nightly: vllm/nightly.md
  - SGLang images:
      - sglang/index.md
      - v0.5.14: sglang/v0.5.14.md
      - v0.5.15: sglang/v0.5.15.md
      - v0.5.16: sglang/v0.5.16.md
  - Diagnostics & tooling:
      - diagnostics/index.md
      - Diagnostics image: diagnostics/diagnostics.md
      - cputests.md
  - Reference:
      - startup.sh anatomy: reference/startup.md
      - arg_normalizer.py: reference/arg_normalizer.md
      - Build & push: reference/build.md